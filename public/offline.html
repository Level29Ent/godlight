<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#060817" />
    <title>Godlight — Offline</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: #060817; color: #f4ecd8; font-family: system-ui, sans-serif; text-align: center; padding: 24px;
      }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { margin: 0; font-size: 1.5rem; letter-spacing: 0.08em; }
      p { margin: 0; color: #a9a6b8; max-width: 28rem; line-height: 1.5; }
      button { margin-top: 8px; background: #f2c14e; color: #060817; border: 0; border-radius: 999px; padding: 12px 24px; font-weight: 600; font-size: 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1>GODLIGHT</h1>
    <p>Your world is waiting, but you&apos;re offline. Reconnect to the internet to keep tending your planet.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </body>
</html>
